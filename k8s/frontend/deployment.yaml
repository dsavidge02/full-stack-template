apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: default
  labels:
    app: frontend-service
spec:
  replicas: 1  # Reduced from 2 to save costs. Increase if high availability is needed.
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      containers:
      - name: frontend-service
        # Replace <ECR_BASE> with your ECR base URL (e.g., 123456789012.dkr.ecr.us-east-1.amazonaws.com)
        # Or use the image tag from GitHub Actions: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/full-stack-template/frontend-service:latest
        image: 914979267695.dkr.ecr.us-east-1.amazonaws.com/full-stack-template/frontend-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        # Health probes
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # Resource limits - right-sized based on actual usage (~1m CPU, ~3Mi memory)
        resources:
          requests:
            memory: "32Mi"   # Reduced from 64Mi (actual usage ~3Mi)
            cpu: "25m"       # Reduced from 50m (actual usage ~1m)
          limits:
            memory: "64Mi"   # Reduced from 128Mi
            cpu: "100m"      # Reduced from 200m

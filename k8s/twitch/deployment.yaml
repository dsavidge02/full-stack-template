apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitch-service
  namespace: default
  labels:
    app: twitch-service
spec:
  replicas: 1  # Reduced from 2 to save costs. Increase if high availability is needed.
  selector:
    matchLabels:
      app: twitch-service
  template:
    metadata:
      labels:
        app: twitch-service
    spec:
      containers:
      - name: twitch-service
        # Replace <ECR_BASE> with your ECR base URL (e.g., 123456789012.dkr.ecr.us-east-1.amazonaws.com)
        # Or use the image tag from GitHub Actions: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/full-stack-template/twitch-service:latest
        image: 914979267695.dkr.ecr.us-east-1.amazonaws.com/full-stack-template/twitch-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4001
          name: http
        env:
        # Environment variables from ConfigMap
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: twitch-config
              key: ENVIRONMENT
        - name: TWITCH_SERVICE_PORT
          valueFrom:
            configMapKeyRef:
              name: twitch-config
              key: TWITCH_SERVICE_PORT
        - name: CERT_PATH
          valueFrom:
            configMapKeyRef:
              name: twitch-config
              key: CERT_PATH
        - name: TWITCH_CHANNEL_LOGIN
          valueFrom:
            configMapKeyRef:
              name: twitch-config
              key: TWITCH_CHANNEL_LOGIN
              optional: true
        # Environment variables from Secrets
        - name: TWITCH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: twitch-secrets
              key: TWITCH_CLIENT_ID
        - name: TWITCH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: twitch-secrets
              key: TWITCH_CLIENT_SECRET
        - name: TWITCH_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: twitch-secrets
              key: TWITCH_REDIRECT_URI
        - name: TWITCH_SERVICE_MONGO_URI
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: AUTH_SERVICE_MONGO_URI
        # Volume mount for certificates
        volumeMounts:
        - name: certs
          mountPath: /app/certs
          readOnly: true
        # Health probes
        livenessProbe:
          httpGet:
            path: /health
            port: 4001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 4001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # Resource limits - conservative values, adjust based on actual usage
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: certs
        secret:
          secretName: auth-certs


apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: default
  labels:
    app: auth-service
spec:
  replicas: 1  # Reduced from 2 to save costs. Increase if high availability is needed.
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        # Replace <ECR_BASE> with your ECR base URL (e.g., 123456789012.dkr.ecr.us-east-1.amazonaws.com)
        # Or use the image tag from GitHub Actions: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/full-stack-template/auth-service:latest
        image: 914979267695.dkr.ecr.us-east-1.amazonaws.com/full-stack-template/auth-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
          name: http
        env:
        # Environment variables from ConfigMap
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: ENVIRONMENT
        - name: AUTH_SERVICE_PORT
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: AUTH_SERVICE_PORT
        - name: CERT_PATH
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: CERT_PATH
        # Environment variables from Secrets
        - name: AUTH_SERVICE_MONGO_URI
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: AUTH_SERVICE_MONGO_URI
        - name: REFRESH_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: REFRESH_TOKEN_SECRET
        # Volume mount for certificates
        volumeMounts:
        - name: certs
          mountPath: /app/certs
          readOnly: true
        # Health probes
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        # Resource limits - right-sized based on actual usage (~3m CPU, ~43Mi memory)
        resources:
          requests:
            memory: "64Mi"   # Reduced from 128Mi (actual usage ~43Mi)
            cpu: "50m"       # Reduced from 100m (actual usage ~3m)
          limits:
            memory: "128Mi"  # Reduced from 256Mi
            cpu: "200m"      # Reduced from 500m
      volumes:
      - name: certs
        secret:
          secretName: auth-certs

